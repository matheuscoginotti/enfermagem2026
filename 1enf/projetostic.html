<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projetos de TIC - 1º Enfermagem</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #1e293b; 
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-gold: #d4af37;
            --accent-blue: #38bdf8;
            --border-tech: rgba(148, 163, 184, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 2rem;
        }

        /* Fundo de Grade */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(var(--border-tech) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-tech) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            opacity: 0.3;
            pointer-events: none;
            animation: grid-move 60s linear infinite;
            z-index: -1;
        }

        @keyframes grid-move {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px) translateZ(-200px); }
        }

        .health-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .health-icon {
            position: absolute;
            bottom: -50px;
            color: rgba(212, 175, 55, 0.15);
            font-size: 1.5rem;
            animation: flyUp linear forwards;
        }

        @keyframes flyUp {
            to { transform: translateY(-110vh); opacity: 0; }
        }

        /* --- Cabeçalho e Botão Voltar --- */
        header {
            text-align: center;
            margin-top: 3rem;
            margin-bottom: 2rem;
            z-index: 2;
            width: 100%;
            max-width: 900px;
            position: relative;
        }

        .btn-back {
            position: absolute;
            left: 20px;
            top: 10px;
            color: var(--text-secondary);
            text-decoration: none;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s ease;
        }

        .btn-back:hover {
            color: var(--accent-blue);
        }

        h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            color: var(--text-primary);
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
            padding: 0 20px;
        }

        .subtitle {
            font-family: 'Rajdhani', sans-serif;
            color: var(--accent-gold);
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 0.5rem;
        }

        /* --- Lista de Aulas/Materiais --- */
        .content-wrapper {
            width: 100%;
            max-width: 900px;
            padding: 0 20px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .material-card {
            background: var(--card-bg);
            border: 1px solid var(--border-tech);
            border-radius: 12px;
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .material-card:hover {
            transform: translateX(10px);
            border-color: var(--accent-blue);
            background: rgba(30, 41, 59, 0.9);
            box-shadow: -5px 5px 20px rgba(56, 189, 248, 0.1);
        }

        .material-info {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
